name: Build & Publish

# Gera o index.html PÚBLICO (somente leitura) e publica no GitHub Pages.
# - a cada push na main
# - de hora em hora (cron) para manter os preços frescos
# - manualmente (workflow_dispatch → botão "Run workflow")
#
# PIPELINE EM 3 ETAPAS (paraleliza a coleta de encomendas p/ encurtar a janela de atualização):
#   1) prepare   — rebaixa o bulk (preços/Δ) + enriquece o top-N; publica os "dados-base" p/ os shards
#   2) orderbook — MATRIX de N runners, cada um varre uma fatia das encomendas (IPs distintos = limites
#                  de taxa da Steam independentes -> roda em paralelo de verdade). Cada shard só grava
#                  um JSON PARCIAL (não toca o cache compartilhado).
#   3) finalize  — consolida os parciais (--merge-orderbook), gera o site e publica no Pages.
# Antes era 1 job sequencial (~70min); agora ~20-25min de ponta a ponta. Pra mudar o nº de shards,
# ajuste a matrix `shard:` E o --orderbook-shards (devem casar).
#
# Os dados (cache do bulk + history.db) NÃO são commitados de volta no repo: persistem entre
# execuções via actions/cache (restore em `prepare`, save em `finalize`) e trafegam entre jobs da
# MESMA run via artifact (`data-base`).
on:
  push:
    branches: [main]
  schedule:
    # Pós-reabertura: cadência estável de 1h. O pipeline sharded roda em ~25min, então 1h mantém
    # os preços/encomendas frescos bem abaixo das 2h do plano antigo, sem pressionar a API da Steam.
    # Se a volatilidade exigir, dá p/ apertar (ex.: */30); se ficar calmo, afrouxar p/ 2h.
    - cron: "0 * * * *"   # de hora em hora
  workflow_dispatch:

# Permissões mínimas: só o necessário para publicar no Pages (sem contents: write).
permissions:
  pages: write
  id-token: write

# uma publicação por vez; não cancela uma em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1) PREPARE: preços/Δ frescos (bulk + enrich) e empacota os dados-base p/ os shards ──────────
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # restore-only: o save do cache final é feito no job `finalize` (com os dados já consolidados).
      # Se `prepare` salvasse aqui, ocuparia a chave data-${run_id} e o `finalize` não conseguiria
      # gravar a versão com as encomendas -> a próxima run restauraria dados sem order book.
      - name: Restaura dados (cache)
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      # rebaixa o bulk da Steam (best-effort): alimenta o price_history (USD) -> Δ24h/Δreabertura.
      - name: Atualiza preços (best-effort)
        continue-on-error: true
        run: timeout 1200 python3 build.py --refresh

      # preço REAL (priceoverview + Δ 24h) do top-N por gold/$ p/ o site não ficar só com estimativas.
      - name: Enriquece top-N (best-effort)
        continue-on-error: true
        run: timeout 1200 python3 build.py --enrich-top 25 --currency brl

      # dados-base (bulk + history.db + enriched + orderbook antigo p/ o TTL) p/ os shards e o finalize
      # usarem EXATAMENTE o mesmo snapshot -> a lista de candidatos das encomendas é idêntica entre eles.
      - name: Empacota dados-base
        uses: actions/upload-artifact@v6
        with:
          name: data-base
          path: data
          retention-days: 1

  # ── 2) ORDERBOOK: matrix de shards — cada runner varre uma fatia (IP próprio = limite próprio) ───
  orderbook:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false   # um shard que estoure não derruba os outros; o merge usa o que chegou
      matrix:
        shard: [0, 1, 2, 3]   # casar com --orderbook-shards abaixo
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Baixa dados-base
        uses: actions/download-artifact@v7
        with:
          name: data-base
          path: data

      # varre só a fatia deste runner e grava um PARCIAL (não toca o cache/histórico compartilhado).
      - name: Coleta encomendas (shard ${{ matrix.shard }})
        continue-on-error: true
        run: >
          timeout 2000 python3 build.py --orderbook-top 0
          --orderbook-shards 4 --orderbook-shard ${{ matrix.shard }}
          --orderbook-out shards/ob-${{ matrix.shard }}.json

      - name: Sobe o parcial do shard
        uses: actions/upload-artifact@v6
        with:
          name: ob-shard-${{ matrix.shard }}
          path: shards/ob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn   # shard sem nenhuma encomenda nova: ok, só não sobe parcial

  # ── 3) FINALIZE: consolida os parciais, gera o site e publica no Pages ──────────────────────────
  finalize:
    needs: orderbook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      # usa a URL da tentativa que deu certo (1ª ou retry)
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Node p/ validar o app.js legado (node --check) E buildar o front novo (Astro) em /next/.
      # Astro exige Node >=22.12; o cache acelera o `npm ci` do web/.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Baixa dados-base
        uses: actions/download-artifact@v7
        with:
          name: data-base
          path: data

      # junta todos os parciais ob-shard-* em ./shards (merge-multiple achata os artifacts num só dir)
      - name: Baixa parciais dos shards
        uses: actions/download-artifact@v7
        with:
          pattern: ob-shard-*
          path: shards
          merge-multiple: true

      # consolida os parciais no orderbook.json + order_history e gera o site PÚBLICO numa só passada
      # (--merge-orderbook roda ANTES do build_rows, que lê o cache p/ anexar as encomendas às linhas).
      - name: Consolida encomendas + gera o site (público)
        run: python3 build.py --merge-orderbook 'shards/*.json' --public

      # valida a sintaxe do JS gerado — pega erro de runtime/sintaxe antes de publicar
      - name: Valida JS (node --check)
        run: node --check assets/app.js

      # rede de segurança: falha o deploy se o build regredir
      - name: Smoke test
        run: python3 tests/smoke.py

      # save do cache com os dados JÁ consolidados (bulk + enrich + encomendas + histórico) p/ a
      # próxima run restaurar via restore-keys "data-".
      - name: Salva dados (cache)
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      # ── CUTOVER (Fase 6): o front novo (Astro) é a RAIZ; o legado fica em /legacy/.
      # continue-on-error: se o build do Astro falhar, o passo de artefato faz FALLBACK
      # p/ o legado na raiz (o site no ar nunca quebra). api/*.json fica na raiz (endpoint
      # público) e também sob /legacy/ (o legado usa paths relativos: assets/ e api/).
      - name: Build do front novo (Astro)
        id: astro
        continue-on-error: true
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Prepara artefato do Pages (cutover)
        run: |
          mkdir -p _site/api
          cp api/*.json _site/api/
          if [ "${{ steps.astro.outcome }}" = "success" ]; then
            echo "Cutover: Astro na raiz, legado em /legacy/"
            cp -r web/dist/. _site/
            mkdir -p _site/legacy/assets _site/legacy/api
            cp index.html _site/legacy/index.html
            cp assets/favicon.svg assets/styles.css assets/app.js _site/legacy/assets/
            cp api/*.json _site/legacy/api/
          else
            echo "::warning::build do Astro falhou — fallback: legado na raiz"
            mkdir -p _site/assets
            cp index.html _site/index.html
            cp assets/favicon.svg assets/styles.css assets/app.js _site/assets/
          fi

      # rasteriza o card OG (SVG -> PNG) p/ preview do legado ao compartilhar o link
      - name: Gera imagem OG (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          ASSETS=$([ -d _site/legacy/assets ] && echo _site/legacy/assets || echo _site/assets)
          rsvg-convert -w 1200 -h 630 assets/og.svg -o "$ASSETS/og.png"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 1ª tentativa: o deploy do Pages às vezes fica preso em "deployment_queued" e estoura o
      # timeout (incidente transitório do GitHub). continue-on-error deixa o job seguir p/ o retry.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # respiro p/ a fila do Pages limpar antes de tentar de novo
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      # retry automático: uma nova tentativa costuma passar.
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
