name: Build & Publish

# Gera o index.html PÚBLICO (somente leitura) e publica no GitHub Pages.
# - a cada push na main
# - a cada 2h (cron) para manter os preços frescos
# - manualmente (workflow_dispatch → botão "Run workflow")
#
# Os dados (cache do bulk + history.db) NÃO são commitados de volta no repo:
# persistem entre execuções via actions/cache, evitando inchar o histórico do git.
on:
  push:
    branches: [main]
  schedule:
    # JANELA DE REABERTURA (25/06/2026): cadência de 1h p/ capturar a formação de preço/encomenda
    # nas primeiras 24–48h. É a cadência máxima ÚTIL: o passo de encomendas varre ~600 itens (~50min),
    # então intervalos menores só empilham execuções (concurrency serializa). REVERTER p/ "0 */2 * * *"
    # quando a volatilidade baixar. Ver .spec/roadmap-d25-reabertura.md (item 3).
    - cron: "0 * * * *"   # de hora em hora (TEMPORÁRIO — normal: 0 */2 * * *)
  workflow_dispatch:

# Permissões mínimas: só o necessário para publicar no Pages (sem contents: write).
permissions:
  pages: write
  id-token: write

# uma publicação por vez; não cancela uma em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 90min: a coleta de encomendas varre TODOS os itens (~5s/req, piso do throttle) -> ~50min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node só p/ validar a sintaxe do app.js gerado (rede de segurança contra erro de JS no deploy).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # carrega os dados acumulados (cache do bulk + history.db) da execução anterior.
      # chave rolante por run_id; restore-keys casa o cache mais recente com prefixo "data-".
      - name: Restaura dados (cache)
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      # rebaixa o bulk da Steam (best-effort: se falhar/limitar, segue com o cache)
      - name: Atualiza preços (best-effort)
        continue-on-error: true
        run: timeout 1200 python3 build.py --refresh

      # busca o preço REAL (priceoverview + mediana + Δ 24h) do top-N por gold/$,
      # para o site público não ficar só com estimativas. Respeita o throttle da Steam.
      - name: Enriquece top-N (best-effort)
        continue-on-error: true
        run: timeout 1200 python3 build.py --enrich-top 25 --currency brl

      # coleta as ENCOMENDAS (buy orders) de TODOS os itens (--orderbook-top 0): maior encomenda
      # + demanda, p/ o ranking "melhor p/ vender por $". Persistido em data/orderbook.json (vai
      # p/ o cache) e gravado incrementalmente, então um timeout aqui não perde o que já coletou.
      # NB: o runner é US -> o order book costuma vir em USD; o front-end converte pela taxa.
      - name: Coleta encomendas (best-effort)
        continue-on-error: true
        run: timeout 4500 python3 build.py --orderbook-top 0

      # gera o site PÚBLICO (somente leitura: sem botões de atualização pela web)
      # roda por último p/ embutir os dados de preço e encomenda já coletados acima.
      - name: Gera o site (público)
        run: python3 build.py --public

      # valida a sintaxe do JS gerado — pega erro de runtime/sintaxe antes de publicar
      - name: Valida JS (node --check)
        run: node --check assets/app.js

      # rede de segurança: falha o deploy se o build regredir
      - name: Smoke test
        run: python3 tests/smoke.py

      - name: Prepara artefato do Pages
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/favicon.svg _site/assets/favicon.svg
          cp assets/styles.css _site/assets/styles.css
          cp assets/app.js _site/assets/app.js

      # rasteriza o card OG (SVG -> PNG) para preview ao compartilhar o link
      - name: Gera imagem OG (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/og.svg -o _site/assets/og.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # usa a URL da tentativa que deu certo (1ª ou retry)
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # 1ª tentativa: o deploy do Pages às vezes fica preso em "deployment_queued" e estoura o
      # timeout (incidente transitório do GitHub). continue-on-error deixa o job seguir p/ o retry.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # respiro p/ a fila do Pages limpar antes de tentar de novo
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      # retry automático: uma nova tentativa costuma passar (foi o que o rerun manual confirmou).
      # Sem continue-on-error: se o retry também falhar, o job falha e o GitHub notifica.
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
